<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lui Wallet" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Dashboard personal para registrar gastos y sincronizarlos con Google Sheets." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Lui Wallet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .wallet-card__head {
        gap: 10px;
      }

      .wallet-card__head-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .sync-pill {
        min-width: 78px;
      }

      .add-pill {
        width: 60px;
        min-height: 44px;
        color: #baff4b;
        border-color: rgba(163, 255, 18, 0.5);
        background: rgba(0, 0, 0, 0.22);
        font-size: 24px;
        box-shadow: none;
      }

      .wallet-label {
        margin-top: 34px;
      }

      .budget-note {
        margin-top: 14px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./config.js"></script>
    <script src="./icons.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
